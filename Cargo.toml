[package]
name = "link-shortener"
version = "0.2.0"
edition = "2021"

[lib]
name = "link_shortener"
path = "src/lib.rs"

[[bin]]
name = "link-shortener"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.7.2", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4"
hickory-resolver = "0.24"
maud = "0.27.0"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8.5"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.108"
sha3 = "0.10.8"
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate", "json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5.1"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
url = "2.5.0"

[dev-dependencies]
tower = { version = "0.5.1", features = ["util"] }
